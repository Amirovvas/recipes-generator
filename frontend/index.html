<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5ef" />
    <!-- Тема до первой отрисовки: без вспышки светлого экрана в тёмной теме -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('chefai.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161412' : '#f8f5ef'
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="Введите продукты, которые есть дома, и получите готовый рецепт от искусственного интеллекта."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ChefAI — рецепт из того, что есть дома</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;1,8..60,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
